.form-select:not(:disabled):hover {

}

.form-select:focus-visible {

}

.form-check {

  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;

  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)

  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)

  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:

    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {

  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));

}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;

  height: 28px;

.form-range::-webkit-slider-runnable-track {

}

.form-range::-webkit-slider-thumb {

.form-range:focus-visible::-webkit-slider-thumb {

}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],

  border-color: var(--primary);

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {

.btn:focus-visible,
.nav-link:focus-visible {

@media (pointer: coarse) {

      { id:&#x27;fairness&#x27;, label:&#x27;Fairness and\nnon-discrimination&#x27;, type:&#x27;principle&#x27;, tags:[&#x27;ethical&#x27;,&#x27;responsible&#x27;,&#x27;trustworthy&#x27;], text:&#x27;Preventing discrimination and distributing benefits and risks fairly.&#x27; },
      { id:&#x27;transparency&#x27;, label:&#x27;Transparency and\nexplainability&#x27;, type:&#x27;principle&#x27;, tags:[&#x27;ethical&#x27;,&#x27;responsible&#x27;,&#x27;trustworthy&#x27;], text:&#x27;Making decisions, limitations and responsibilities intelligible.&#x27; },
      { id:&#x27;accountability&#x27;, label:&#x27;Accountability\nand remedy&#x27;, type:&#x27;principle&#x27;, tags:[&#x27;ethical&#x27;,&#x27;responsible&#x27;,&#x27;trustworthy&#x27;], text:&#x27;Assigning duties, enabling contestation and providing consequences and remedy.&#x27; },
      { id:&#x27;privacy&#x27;, label:&#x27;Privacy and\ndata governance&#x27;, type:&#x27;principle&#x27;, tags:[&#x27;ethical&#x27;,&#x27;responsible&#x27;,&#x27;trustworthy&#x27;], text:&#x27;Protecting personal data and governing its collection, access and use.&#x27; },
      { id:&#x27;safety&#x27;, label:&#x27;Safety and\nrobustness&#x27;, type:&#x27;principle&#x27;, tags:[&#x27;responsible&#x27;,&#x27;trustworthy&#x27;], text:&#x27;Ensuring valid, reliable, secure and resilient performance.&#x27; },
      { id:&#x27;rights&#x27;, label:&#x27;Human rights\nand dignity&#x27;, type:&#x27;principle&#x27;, tags:[&#x27;ethical&#x27;,&#x27;trustworthy&#x27;], text:&#x27;Grounding AI development in fundamental rights, freedom and human dignity.&#x27; },
      { id:&#x27;oversight&#x27;, label:&#x27;Human agency\nand oversight&#x27;, type:&#x27;principle&#x27;, tags:[&#x27;responsible&#x27;,&#x27;trustworthy&#x27;], text:&#x27;Preserving meaningful human intervention and decision-making capacity.&#x27; },
      { id:&#x27;wellbeing&#x27;, label:&#x27;Social well-being\nand sustainability&#x27;, type:&#x27;principle&#x27;, tags:[&#x27;ethical&#x27;,&#x27;trustworthy&#x27;], text:&#x27;Considering social, democratic and environmental consequences.&#x27; },
      { id:&#x27;innovation&#x27;, label:&#x27;Benefits and\ninnovation&#x27;, type:&#x27;principle&#x27;, tags:[&#x27;ethical&#x27;,&#x27;responsible&#x27;,&#x27;trustworthy&#x27;], text:&#x27;Combining harm prevention with socially beneficial innovation.&#x27; }
    ];

    const edges = [];
    const connect = (source, target, kind = &#x27;primary&#x27;) =&gt; edges.push({ source, target, kind });
    nodes.filter(node =&gt; node.type === &#x27;institution&#x27;).forEach(node =&gt; {
      node.tags.forEach((tag, index) =&gt; connect(node.id, tag, index === 0 ? &#x27;primary&#x27; : &#x27;bridge&#x27;));
    });
    [&#x27;fairness&#x27;,&#x27;transparency&#x27;,&#x27;accountability&#x27;,&#x27;privacy&#x27;,&#x27;rights&#x27;,&#x27;wellbeing&#x27;,&#x27;innovation&#x27;].forEach(id =&gt; connect(&#x27;ethical&#x27;, id));
    [&#x27;fairness&#x27;,&#x27;transparency&#x27;,&#x27;accountability&#x27;,&#x27;privacy&#x27;,&#x27;safety&#x27;,&#x27;oversight&#x27;,&#x27;innovation&#x27;].forEach(id =&gt; connect(&#x27;responsible&#x27;, id));
    [&#x27;fairness&#x27;,&#x27;transparency&#x27;,&#x27;accountability&#x27;,&#x27;privacy&#x27;,&#x27;safety&#x27;,&#x27;rights&#x27;,&#x27;oversight&#x27;,&#x27;wellbeing&#x27;,&#x27;innovation&#x27;].forEach(id =&gt; connect(&#x27;trustworthy&#x27;, id));

    const nodeById = new Map(nodes.map(node =&gt; [node.id, node]));
    let selectedId = null;
    let activeFilter = &#x27;all&#x27;;

    function element(name, attributes = {}) {
      const item = document.createElementNS(NS, name);
      Object.entries(attributes).forEach(([key, value]) =&gt; item.setAttribute(key, value));
      return item;
    }

    function splitLabel(label) {
      if (label.includes(&#x27;\n&#x27;)) return label;
      if (label.length &lt; 24) return label;
      const words = label.split(&#x27; &#x27;);
      let cut = 1;
      let best = Infinity;
      for (let i = 1; i &lt; words.length; i += 1) {
        const difference = Math.abs(words.slice(0, i).join(&#x27; &#x27;).length - words.slice(i).join(&#x27; &#x27;).length);
        if (difference &lt; best) { best = difference; cut = i; }
      }
      return `${words.slice(0, cut).join(&#x27; &#x27;)}\n${words.slice(cut).join(&#x27; &#x27;)}`;
    }

    function addText(group, label) {
      const text = element(&#x27;text&#x27;, { x:0, y:4 });
      const lines = splitLabel(label).split(&#x27;\n&#x27;);
      lines.forEach((line, index) =&gt; {
        const span = element(&#x27;tspan&#x27;, { x:0, dy:index === 0 ? `${-(lines.length - 1) * 6}px` : &#x27;13px&#x27; });
        span.textContent = line;
        text.appendChild(span);
      });
      group.appendChild(text);
    }

    function createLayout(width) {
      const positions = new Map();
      const institutions = nodes.filter(node =&gt; node.type === &#x27;institution&#x27;);
      const principles = nodes.filter(node =&gt; node.type === &#x27;principle&#x27;);
      let height;

      if (width &gt;= 900) {
        height = 700;
        institutions.forEach((node, index) =&gt; positions.set(node.id, {
          x: width * (.10 + (index % 2) * .17),
          y: 52 + Math.floor(index / 2) * 82
        }));
        positions.set(&#x27;ethical&#x27;, { x:width * .48, y:145 });
        positions.set(&#x27;responsible&#x27;, { x:width * .48, y:350 });
        positions.set(&#x27;trustworthy&#x27;, { x:width * .48, y:555 });
        principles.forEach((node, index) =&gt; positions.set(node.id, {
          x: width * (.70 + (index % 2) * .18),
          y: 55 + Math.floor(index / 2) * 135
        }));
      } else if (width &gt;= 520) {
        height = 790;
        institutions.forEach((node, index) =&gt; positions.set(node.id, {
          x: width * (.17 + (index % 3) * .33),
          y: 42 + Math.floor(index / 3) * 56
        }));
        positions.set(&#x27;ethical&#x27;, { x:width * .20, y:415 });
        positions.set(&#x27;responsible&#x27;, { x:width * .50, y:415 });
        positions.set(&#x27;trustworthy&#x27;, { x:width * .80, y:415 });
        principles.forEach((node, index) =&gt; positions.set(node.id, {
          x: width * (.17 + (index % 3) * .33),
          y: 550 + Math.floor(index / 3) * 76
        }));
      } else {
        height = 1135;
        institutions.forEach((node, index) =&gt; positions.set(node.id, {
          x: width * (.25 + (index % 2) * .50),
          y: 38 + Math.floor(index / 2) * 57
        }));
        positions.set(&#x27;ethical&#x27;, { x:width * .22, y:550 });
        positions.set(&#x27;responsible&#x27;, { x:width * .50, y:655 });
        positions.set(&#x27;trustworthy&#x27;, { x:width * .78, y:550 });
        principles.forEach((node, index) =&gt; positions.set(node.id, {
          x: width * (.25 + (index % 2) * .50),
          y: 785 + Math.floor(index / 2) * 67
        }));
      }
      return { positions, height };
    }

    function draw() {
      const width = Math.max(320, Math.round(root.querySelector(&#x27;.eacn-stage&#x27;).clientWidth));
      const { positions, height } = createLayout(width);
      const title = svg.querySelector(&#x27;title&#x27;);
      const desc = svg.querySelector(&#x27;desc&#x27;);
      svg.replaceChildren(title, desc);
      svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`);

      const edgeLayer = element(&#x27;g&#x27;);
      const nodeLayer = element(&#x27;g&#x27;);
      svg.append(edgeLayer, nodeLayer);

      edges.forEach(edge =&gt; {
        const source = positions.get(edge.source);
        const target = positions.get(edge.target);
        const path = element(&#x27;path&#x27;, {
          class:`eacn-edge ${edge.kind}`,
          d:`M ${source.x} ${source.y} C ${source.x + (target.x-source.x)*.42} ${source.y}, ${target.x - (target.x-source.x)*.42} ${target.y}, ${target.x} ${target.y}`,
          &#x27;data-source&#x27;:edge.source,
          &#x27;data-target&#x27;:edge.target
        });
        edgeLayer.appendChild(path);
      });

      nodes.forEach(node =&gt; {
        const position = positions.get(node.id);
        const anchor = element(&#x27;a&#x27;, { href:`#${node.id}`, &#x27;aria-label&#x27;:`${node.label.replace(/\n/g, &#x27; &#x27;)}${node.country ? `, ${node.country}` : &#x27;&#x27;}` });
        const group = element(&#x27;g&#x27;, {
          class:`eacn-node ${node.type} ${node.type === &#x27;concept&#x27; ? node.id : &#x27;&#x27;}`,
          transform:`translate(${position.x} ${position.y})`,
          &#x27;data-id&#x27;:node.id
        });

        if (node.type === &#x27;concept&#x27;) {
          group.appendChild(element(&#x27;circle&#x27;, { r:width &lt; 520 ? 43 : 49 }));
        } else {
          const nodeWidth = node.type === &#x27;institution&#x27; ? (width &lt; 520 ? 142 : width &lt; 900 ? 150 : 158) : (width &lt; 520 ? 142 : 150);
          const nodeHeight = node.type === &#x27;institution&#x27; ? 38 : 46;
          group.appendChild(element(&#x27;rect&#x27;, { x:-nodeWidth/2, y:-nodeHeight/2, width:nodeWidth, height:nodeHeight, rx:12 }));
        }
        addText(group, node.label);
        anchor.appendChild(group);
        anchor.addEventListener(&#x27;click&#x27;, event =&gt; {
          event.preventDefault();
          selectNode(node.id);
        });
        nodeLayer.appendChild(anchor);
      });
      updateNetwork();
    }

    function selectNode(id) {
      selectedId = selectedId === id ? null : id;
      const node = nodeById.get(id);
      if (selectedId) {
        detailTitle.textContent = node.label.replace(/\n/g, &#x27; &#x27;);
        detailText.textContent = node.country ? `${node.country}. ${node.text}` : node.text;
        detailLink.hidden = !node.url;
        if (node.url) detailLink.href = node.url;
      } else {
        resetDetail();
      }
      updateNetwork();
    }

    function resetDetail() {
      detailTitle.textContent = &#x27;How to read the network&#x27;;
      detailText.textContent = &#x27;Select a node to highlight its direct relationships. Solid lines show a primary association; dashed lines show an institution that bridges more than one vocabulary.&#x27;;
      detailLink.hidden = true;
      detailLink.removeAttribute(&#x27;href&#x27;);
    }

    function updateNetwork() {
      const neighbours = new Set(selectedId ? [selectedId] : []);
      if (selectedId) {
        edges.forEach(edge =&gt; {
          if (edge.source === selectedId) neighbours.add(edge.target);
          if (edge.target === selectedId) neighbours.add(edge.source);
        });
      }

      root.querySelectorAll(&#x27;.eacn-node&#x27;).forEach(group =&gt; {
        const node = nodeById.get(group.dataset.id);
        const matchesFilter = activeFilter === &#x27;all&#x27; || node.tags.includes(activeFilter);
        const matchesSelection = !selectedId || neighbours.has(node.id);
        group.classList.toggle(&#x27;is-muted&#x27;, !(matchesFilter &amp;&amp; matchesSelection));
        group.classList.toggle(&#x27;is-selected&#x27;, node.id === selectedId);
      });

      root.querySelectorAll(&#x27;.eacn-edge&#x27;).forEach(path =&gt; {
        const source = nodeById.get(path.dataset.source);
        const target = nodeById.get(path.dataset.target);
        const matchesFilter = activeFilter === &#x27;all&#x27; || (source.tags.includes(activeFilter) &amp;&amp; target.tags.includes(activeFilter));
        const isActive = selectedId &amp;&amp; (source.id === selectedId || target.id === selectedId);
        path.classList.toggle(&#x27;is-muted&#x27;, !(matchesFilter &amp;&amp; (!selectedId || isActive)));
        path.classList.toggle(&#x27;is-active&#x27;, Boolean(isActive));
      });
    }

    root.querySelectorAll(&#x27;[data-filter]&#x27;).forEach(button =&gt; {
      button.addEventListener(&#x27;click&#x27;, () =&gt; {
        activeFilter = button.dataset.filter;
        selectedId = null;
        root.querySelectorAll(&#x27;[data-filter]&#x27;).forEach(item =&gt; item.setAttribute(&#x27;aria-pressed&#x27;, String(item === button)));
        resetDetail();
        if (activeFilter !== &#x27;all&#x27;) {
          const concept = nodeById.get(activeFilter);
          detailTitle.textContent = concept.label.replace(/\n/g, &#x27; &#x27;);
          detailText.textContent = concept.text;
        }
        updateNetwork();
      });
    });

    let resizeTimer;
    new ResizeObserver(() =&gt; {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(draw, 80);
    }).observe(root.querySelector(&#x27;.eacn-stage&#x27;));
    draw();
  })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {

    return;
  }

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };

    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;

      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);

          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }

    const tab = event.target?.closest?.(selector);

      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
&lt;/script&gt;
