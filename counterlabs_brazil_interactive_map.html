<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counter-labs in Brazil — concept map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  :root{
    --ink:#101a17;
    --panel:#16221e;
    --panel-2:#1c2b26;
    --paper:#efece2;
    --paper-dim:#a9b3ac;
    --line:#2a3a34;
    --academia:#5c7fc4;
    --sociedade:#c7622f;
    --movimentos:#9b5fc0;
    --jornalismo:#3f9c6b;
    --infra:#d0a23a;
    --conceito:#7f9089;
    --conceito-glow:#a9bcae;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    overflow:hidden;
  }
  #app{
    display:grid;
    grid-template-columns: 300px 1fr;
    height:100vh; width:100vw;
  }
  /* ---------- Sidebar ---------- */
  #sidebar{
    background:var(--panel);
    border-right:1px solid var(--line);
    padding:22px 20px 16px;
    display:flex;
    flex-direction:column;
    gap:18px;
    overflow-y:auto;
    z-index:5;
  }
  header h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    line-height:1.15;
    margin:0 0 6px;
    color:var(--paper);
  }
  header p{
    margin:0;
    font-size:12.5px;
    line-height:1.5;
    color:var(--paper-dim);
  }
  .section-label{
    font-size:11px;
    letter-spacing:0.02em;
    color:var(--paper-dim);
    margin:0 0 8px;
    font-weight:500;
  }
  #search{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--paper);
    padding:9px 12px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    outline:none;
  }
  #search::placeholder{color:var(--paper-dim);}
  #search:focus{border-color:var(--conceito-glow);}
  .legend-item{
    display:flex;
    align-items:center;
    gap:9px;
    padding:6px 8px;
    border-radius:7px;
    cursor:pointer;
    font-size:12.5px;
    color:var(--paper);
    user-select:none;
    transition:background .15s ease;
  }
  .legend-item:hover{background:var(--panel-2);}
  .legend-item.off{opacity:0.35;}
  .swatch{
    width:11px; height:11px; border-radius:50%; flex:0 0 auto;
  }
  .legend-count{
    margin-left:auto;
    font-size:11px;
    color:var(--paper-dim);
  }
  #stats{
    font-size:12px;
    color:var(--paper-dim);
    line-height:1.6;
    border-top:1px solid var(--line);
    padding-top:14px;
  }
  #stats b{color:var(--paper); font-weight:600;}
  .btn{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    padding:8px 10px;
    border-radius:7px;
    cursor:pointer;
    text-align:left;
  }
  .btn:hover{border-color:var(--conceito-glow);}
  /* ---------- Graph area ---------- */
  #graph-wrap{
    position:relative;
    overflow:hidden;
  }
  svg{width:100%; height:100%; display:block; cursor:grab;}
  svg:active{cursor:grabbing;}
  .link{
    stroke:#4a5a53;
    stroke-opacity:0.45;
  }
  .link.dim{ stroke-opacity:0.06; }
  .link.lit{ stroke:var(--paper); stroke-opacity:0.85; }
  .node circle{
    stroke:var(--ink);
    stroke-width:1.2px;
    cursor:pointer;
  }
  .node.dim{ opacity:0.12; }
  .node text{
    font-family:'Inter',sans-serif;
    font-size:10.5px;
    fill:var(--paper);
    pointer-events:none;
    paint-order:stroke;
    stroke:var(--ink);
    stroke-width:3px;
    stroke-linejoin:round;
  }
  .node.concept text{ fill:var(--paper-dim); font-size:9.5px; }
  .node.lit text{ fill:var(--paper); font-weight:600; }
  /* top-right controls */
  #controls{
    position:absolute; top:16px; right:16px;
    display:flex; gap:8px; z-index:4;
  }
  .icon-btn{
    background:rgba(22,34,30,0.85);
    border:1px solid var(--line);
    color:var(--paper);
    width:32px; height:32px;
    border-radius:7px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size:15px;
    backdrop-filter:blur(4px);
  }
  .icon-btn:hover{border-color:var(--conceito-glow);}
  /* detail panel */
  #detail{
    position:absolute; top:0; right:0; bottom:0;
    width:340px;
    background:rgba(22,34,30,0.97);
    border-left:1px solid var(--line);
    transform:translateX(100%);
    transition:transform .25s ease;
    padding:24px 22px;
    overflow-y:auto;
    z-index:6;
  }
  #detail.open{ transform:translateX(0); }
  #detail .close{
    position:absolute; top:16px; right:16px;
    background:none; border:none; color:var(--paper-dim);
    font-size:18px; cursor:pointer;
  }
  #detail .tag{
    display:inline-block;
    font-size:10.5px;
    padding:3px 9px;
    border-radius:100px;
    margin:0 6px 6px 0;
    color:var(--ink);
    font-weight:600;
  }
  #detail h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:21px;
    margin:14px 0 4px;
    line-height:1.2;
  }
  #detail .meta{
    font-size:12px;
    color:var(--paper-dim);
    margin-bottom:14px;
    line-height:1.6;
  }
  #detail .block{ margin-bottom:16px; }
  #detail .block h4{
    font-size:11px;
    text-transform:none;
    color:var(--paper-dim);
    margin:0 0 6px;
    font-weight:600;
  }
  #detail .block p{
    font-size:13px;
    line-height:1.55;
    margin:0;
    color:var(--paper);
  }
  #detail .related{
    display:flex; flex-wrap:wrap; gap:6px;
  }
  #detail .chip{
    font-size:11.5px;
    padding:5px 10px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:100px;
    cursor:pointer;
    color:var(--paper);
  }
  #detail .chip:hover{border-color:var(--conceito-glow);}
  #detail a{ color:var(--paper); }
  #tooltip{
    position:absolute;
    pointer-events:none;
    background:rgba(16,26,23,0.95);
    border:1px solid var(--line);
    color:var(--paper);
    font-size:12px;
    padding:6px 10px;
    border-radius:6px;
    max-width:220px;
    opacity:0;
    transition:opacity .12s ease;
    z-index:7;
  }
  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <header>
      <h1>Counter-labs in Brazil</h1>
      <p>A network of initiatives and the concepts that bring them together — academia, civil society, movements, journalism and coalitions working on technology, data and AI.</p>
    </header>

    <div>
      <p class="section-label">Search</p>
      <input id="search" type="text" placeholder="Name or concept..." autocomplete="off">
    </div>

    <div>
      <p class="section-label">Categories</p>
      <div id="legend"></div>
    </div>

    <button class="btn" id="reset-btn">↺ Clear selection and recenter</button>

    <div id="stats"></div>
  </div>

  <div id="graph-wrap">
    <div id="controls">
      <div class="icon-btn" id="zoom-in" title="Zoom in">+</div>
      <div class="icon-btn" id="zoom-out" title="Zoom out">–</div>
    </div>
    <svg id="graph"></svg>
    <div id="tooltip"></div>
    <div id="detail">
      <button class="close" id="detail-close">✕</button>
      <div id="detail-content"></div>
    </div>
  </div>
</div>

// ============ SETUP ============
const svg = d3.select('#graph');
const wrap = document.getElementById('graph-wrap');
const g = svg.append('g');
const linkLayer = g.append('g').attr('class', 'links');
const nodeLayer = g.append('g').attr('class', 'nodes');

const tooltip = d3.select('#tooltip');
const detailPanel = document.getElementById('detail');
const detailContent = document.getElementById('detail-content');

let width = wrap.clientWidth, height = wrap.clientHeight;
svg.attr('viewBox', [0, 0, width, height]);

// degree count (for sizing concept nodes)
const degree = {};
GRAPH_DATA.nodes.forEach(n => degree[n.id] = 0);
GRAPH_DATA.links.forEach(l => {
  degree[l.source] = (degree[l.source] || 0) + 1;
  degree[l.target] = (degree[l.target] || 0) + 1;
});

function nodeRadius(d) {
  if (d.type === 'iniciativa') return 9;
  return Math.min(15, 4 + Math.sqrt(degree[d.id] || 1) * 2.1);
}
function nodeColor(d) {
  if (d.type === 'iniciativa') return CAT_COLORS[d.cat_slug] || '#888';
  return CONCEPT_COLOR;
}

// index for quick lookup
const nodeById = new Map(GRAPH_DATA.nodes.map(n => [n.id, n]));
const neighbors = new Map();
GRAPH_DATA.nodes.forEach(n => neighbors.set(n.id, new Set([n.id])));
GRAPH_DATA.links.forEach(l => {
  neighbors.get(l.source).add(l.target);
  neighbors.get(l.target).add(l.source);
});

// ============ FORCE SIMULATION ============
const simulation = d3.forceSimulation(GRAPH_DATA.nodes)
  .force('link', d3.forceLink(GRAPH_DATA.links).id(d => d.id).distance(l => {
    return 55;
  }).strength(0.55))
  .force('charge', d3.forceManyBody().strength(d => d.type === 'iniciativa' ? -220 : -90))
  .force('center', d3.forceCenter(width / 2, height / 2))
  .force('collide', d3.forceCollide().radius(d => nodeRadius(d) + 6))
  .force('x', d3.forceX(width / 2).strength(0.03))
  .force('y', d3.forceY(height / 2).strength(0.03));

const link = linkLayer.selectAll('line')
  .data(GRAPH_DATA.links)
  .join('line')
  .attr('class', 'link')
  .attr('stroke-width', 1);

const node = nodeLayer.selectAll('g.node')
  .data(GRAPH_DATA.nodes)
  .join('g')
  .attr('class', d => 'node ' + (d.type === 'conceito' ? 'concept' : 'init'))
  .call(drag(simulation));

node.append('circle')
  .attr('r', nodeRadius)
  .attr('fill', nodeColor);

node.append('text')
  .attr('x', d => nodeRadius(d) + 4)
  .attr('y', 3)
  .text(d => d.label);

node.on('mouseover', (event, d) => {
    tooltip.style('opacity', 1)
      .html(`<b>${d.label}</b>${d.type === 'iniciativa' ? '<br>' + (d.categoria || '') : '<br>concept · ' + (degree[d.id] || 0) + ' connections'}`);
  })
  .on('mousemove', (event) => {
    const [mx, my] = d3.pointer(event, wrap);
    tooltip.style('left', (mx + 16) + 'px').style('top', (my + 10) + 'px');
  })
  .on('mouseout', () => tooltip.style('opacity', 0))
  .on('click', (event, d) => {
    event.stopPropagation();
    selectNode(d);
  });

simulation.on('tick', () => {
  link
    .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  node.attr('transform', d => `translate(${d.x},${d.y})`);
});

function drag(sim) {
  function started(event, d) {
    if (!event.active) sim.alphaTarget(0.15).restart();
    d.fx = d.x; d.fy = d.y;
  }
  function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
  function ended(event, d) {
    if (!event.active) sim.alphaTarget(0);
    d.fx = null; d.fy = null;
  }
  return d3.drag().on('start', started).on('drag', dragged).on('end', ended);
}

// ============ ZOOM ============
const zoom = d3.zoom().scaleExtent([0.15, 6]).on('zoom', (event) => {
  g.attr('transform', event.transform);
});
svg.call(zoom).on('dblclick.zoom', null);

document.getElementById('zoom-in').onclick = () => svg.transition().duration(200).call(zoom.scaleBy, 1.4);
document.getElementById('zoom-out').onclick = () => svg.transition().duration(200).call(zoom.scaleBy, 1/1.4);

svg.on('click', () => clearSelection());

// ============ SELECTION / HIGHLIGHT ============
let activeCategories = new Set(Object.keys(CAT_COLORS));
let selectedId = null;

function selectNode(d) {
  selectedId = d.id;
  const ns = neighbors.get(d.id);
  node.classed('dim', n => !ns.has(n.id));
  node.classed('lit', n => n.id === d.id);
  link.classed('dim', l => !(ns.has(l.source.id) && ns.has(l.target.id)))
      .classed('lit', l => l.source.id === d.id || l.target.id === d.id);
  showDetail(d);
}

function clearSelection() {
  selectedId = null;
  node.classed('dim', false).classed('lit', false);
  link.classed('dim', false).classed('lit', false);
  detailPanel.classList.remove('open');
  applyFilter();
}

document.getElementById('detail-close').onclick = clearSelection;
document.getElementById('reset-btn').onclick = () => {
  clearSelection();
  svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity);
};

function showDetail(d) {
  let html = '';
  if (d.type === 'iniciativa') {
    const color = CAT_COLORS[d.cat_slug] || '#888';
    html += `<span class="tag" style="background:${color}">${d.categoria || ''}</span>`;
    html += `<h2>${d.label}</h2>`;
    html += `<div class="meta">${d.natureza_ator || ''} · ${d.cidade || ''}${d.uf && d.uf !== 'Não informado' ? ', ' + d.uf : ''}<br>Scope: ${d.escala || ''}<br>Relation to AI: ${d.relacao_com_ia || ''} · Alignment: ${d.aderencia || ''}</div>`;
    if (d.sintese) html += `<div class="block"><h4>Summary</h4><p>${d.sintese}</p></div>`;
    if (d.justificativa) html += `<div class="block"><h4>Alignment with the counter-lab category</h4><p>${d.justificativa}</p></div>`;
    const concepts = GRAPH_DATA.links.filter(l => l.source.id === d.id).map(l => nodeById.get(l.target.id));
    if (concepts.length) {
      html += `<div class="block"><h4>Concepts (${concepts.length})</h4><div class="related">`;
      concepts.forEach(c => html += `<span class="chip" data-id="${c.id}">${c.label}</span>`);
      html += `</div></div>`;
    }
    if (d.url) html += `<div class="block"><h4>Source</h4><p><a href="${d.url}" target="_blank" rel="noopener">${d.url}</a></p></div>`;
  } else {
    html += `<span class="tag" style="background:${CONCEPT_COLOR}">Concept</span>`;
    html += `<h2>${d.label}</h2>`;
    const inits = GRAPH_DATA.links.filter(l => l.target.id === d.id).map(l => nodeById.get(l.source.id));
    html += `<div class="meta">Referenced by ${inits.length} initiative${inits.length === 1 ? '' : 's'}</div>`;
    html += `<div class="block"><h4>Related initiatives</h4><div class="related">`;
    inits.forEach(i => html += `<span class="chip" data-id="${i.id}" style="border-color:${CAT_COLORS[i.cat_slug]}66">${i.label}</span>`);
    html += `</div></div>`;
  }
  detailContent.innerHTML = html;
  detailPanel.classList.add('open');
  detailContent.querySelectorAll('.chip').forEach(chip => {
    chip.onclick = (e) => {
      e.stopPropagation();
      const target = nodeById.get(chip.dataset.id);
      if (target) selectNode(target);
    };
  });
}

// ============ LEGEND / FILTERS ============
const legendEl = document.getElementById('legend');
const catCounts = {};
GRAPH_DATA.nodes.forEach(n => {
  if (n.type === 'iniciativa') catCounts[n.cat_slug] = (catCounts[n.cat_slug] || 0) + 1;
});
Object.keys(CAT_COLORS).forEach(slug => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.dataset.slug = slug;
  item.innerHTML = `<span class="swatch" style="background:${CAT_COLORS[slug]}"></span>${CAT_LABELS[slug]}<span class="legend-count">${catCounts[slug] || 0}</span>`;
  item.onclick = () => {
    if (activeCategories.has(slug)) { activeCategories.delete(slug); item.classList.add('off'); }
    else { activeCategories.add(slug); item.classList.remove('off'); }
    applyFilter();
  };
  legendEl.appendChild(item);
});
const conceptItem = document.createElement('div');
conceptItem.className = 'legend-item';
conceptItem.innerHTML = `<span class="swatch" style="background:${CONCEPT_COLOR}"></span>Concepts<span class="legend-count">${GRAPH_DATA.nodes.filter(n=>n.type==='conceito').length}</span>`;
legendEl.appendChild(conceptItem);

function applyFilter() {
  const visibleInitIds = new Set(
    GRAPH_DATA.nodes.filter(n => n.type === 'iniciativa' && activeCategories.has(n.cat_slug)).map(n => n.id)
  );
  // a concept is visible if it connects to at least one visible initiative
  const visibleConceptIds = new Set();
  GRAPH_DATA.links.forEach(l => {
    if (visibleInitIds.has(l.source.id)) visibleConceptIds.add(l.target.id);
  });
  node.style('display', d => {
    if (d.type === 'iniciativa') return visibleInitIds.has(d.id) ? null : 'none';
    return visibleConceptIds.has(d.id) ? null : 'none';
  });
  link.style('display', l => (visibleInitIds.has(l.source.id) && visibleConceptIds.has(l.target.id)) ? null : 'none');
}

// ============ SEARCH ============
const searchInput = document.getElementById('search');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) { clearSelection(); return; }
  const matchIds = new Set(GRAPH_DATA.nodes.filter(n => n.label.toLowerCase().includes(q)).map(n => n.id));
  node.classed('dim', n => !matchIds.has(n.id));
  node.classed('lit', n => matchIds.has(n.id));
  link.classed('dim', l => !(matchIds.has(l.source.id) || matchIds.has(l.target.id)));
});

// ============ STATS ============
document.getElementById('stats').innerHTML =
  `<b>${GRAPH_DATA.nodes.filter(n=>n.type==='iniciativa').length}</b> initiatives &nbsp;·&nbsp; <b>${GRAPH_DATA.nodes.filter(n=>n.type==='conceito').length}</b> concepts<br>
   <b>${GRAPH_DATA.links.length}</b> connections<br><br>
   Drag nodes, scroll to zoom, click for details.`;

// ============ RESIZE ============
window.addEventListener('resize', () => {
  width = wrap.clientWidth; height = wrap.clientHeight;
  svg.attr('viewBox', [0, 0, width, height]);
  simulation.force('center', d3.forceCenter(width / 2, height / 2));
  simulation.alpha(0.3).restart();
});
</script>
</body>
</html>
